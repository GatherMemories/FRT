name: release

# 打 tag（v*）时自动在 Windows / Linux / macOS 三平台构建：
# 每个平台各自 jlink 生成对应 runtime，打出"带运行时、无 JDK 可运行"的发布包
# 并上传到 GitHub Release——开发者无需为每个系统准备电脑
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 拉全量历史（含 tags）：发布说明需用 git log 对比上一 tag 生成"本次更新"列表
          fetch-depth: 0

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 同步版本号到 pom（跟随 tag，发版无需手动改 pom）
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B -q versions:set -DnewVersion="$VERSION"

      - name: 构建 jar（跳过测试）
        run: mvn -B -q package -DskipTests

      - name: 生成精简运行时 runtime/（无 JDK 环境可运行）
        shell: bash
        run: |
          # jdk.crypto.ec 必须包含：SunEC 提供 ECDHE 密钥交换，GitHub API 等现代 HTTPS 需要它，
          # 缺失会导致发布包里"检查更新"等 HTTPS 请求握手失败（用户实测 Windows 无法检查更新）
          jlink --add-modules java.base,java.desktop,java.naming,java.sql,jdk.unsupported,jdk.compiler,jdk.crypto.ec \
                --strip-debug --no-header-files --no-man-pages \
                --output release/runtime

      - name: 打包发布 zip（含 runtime + jar + 脚本 + 配置 + 文档）
        shell: bash
        run: |
          set -e
          cd release
          chmod +x runtime/bin/java 2>/dev/null || true
          # 版本号跟随 tag（v0.1.1 -> 0.1.1），zip 名不再硬编码
          VERSION="${GITHUB_REF_NAME#v}"
          PLATFORM="${{ matrix.os }}"
          case "$PLATFORM" in
            ubuntu*)  ZIP="MultiLevelFolderUpdater-${VERSION}-linux.zip" ;;
            windows*) ZIP="MultiLevelFolderUpdater-${VERSION}-windows.zip" ;;
            macos*)   ZIP="MultiLevelFolderUpdater-${VERSION}-macos.zip" ;;
          esac
          # jar 名通配（target/FRT-*.jar，排除 shade 前的 original-*）
          cp ../target/FRT-*.jar ../start-frt.sh ../start-frt.bat ../README.md . 
          # 不含 config.json：程序有内置默认配置，缺失时自动创建目录（首次启动即可用）
          # 统一用 python 打包（Windows runner 没有 zip 命令；Linux/macOS 有 python3）
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -m zipfile -c "$ZIP" runtime FRT-*.jar start-frt.sh start-frt.bat README.md
          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: 上传到 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 确保 Release 存在（首个平台创建，其余平台复用）；zip 在 release/ 下
          cd release
          # 发布说明：自动对比上一 tag 生成"本次更新"提交列表（--no-merges 只列实际改动，首版无上一 tag 时列最近 20 条）
          PREV_TAG="$(git describe --tags --abbrev=0 "${{ github.ref_name }}"^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            CHANGES="$(git log --no-merges --pretty=format:'- %s' "$PREV_TAG".."${{ github.ref_name }}")"
          else
            CHANGES="$(git log --no-merges --pretty=format:'- %s' -20 "${{ github.ref_name }}")"
          fi
          NOTES="## 本次更新
          $CHANGES

          ---
          三平台自动构建发布包（各含精简运行时，无需安装 JDK）"
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" \
            --notes "$NOTES" --target main || true
          gh release upload "${{ github.ref_name }}" "${{ env.ZIP_FILE }}" --clobber
